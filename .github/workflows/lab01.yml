name: Lab checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install uv
      - run: uv sync
      - run: uv run ruff check --fix .
      - run: uv run ruff format .
      - run: git diff
      - run: cat uv.lock
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest --cov=findex --cov-report=term-missing
      - run: uv build
      - run: uv tool install dist/*.whl
      - run: findex --help
      - uses: actions/upload-artifact@v4
        with:
          name: findex-wheel
          path: dist/*.whl
      - run: uv run python scripts/benchmark_lab06.py 1
      - run: uv run python scripts/benchmark_lab06.py 5
      - run: uv run python scripts/benchmark_lab06.py 20
      - uses: actions/upload-artifact@v4
        with:
          name: lab06-logs
          path: crawl-*.log
