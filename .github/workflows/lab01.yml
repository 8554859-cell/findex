name: Lab 08 checks
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install uv
      - run: uv sync
      - run: uv run ruff check --fix .
      - run: uv run ruff format .
      - run: git diff -- . ':!uv.lock'
      - run: cat uv.lock
      - run: uv run pyright
      - run: uv run pytest --cov=findex --cov-report=term-missing
      - run: uv run python scripts/download_python_docs.py
      - run: uv run findex index data/python_docs --out data/index.json --positions
      - run: uv run python scripts/benchmark_lab08.py
