name: Lab 01 checks
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install uv
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv run python scripts/download_python_docs.py
      - run: uv run python -m findex.stats data/python_docs --compare
