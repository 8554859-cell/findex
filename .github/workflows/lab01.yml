name: Lab checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install uv
      - run: uv sync
      - name: Export lock and formatted patch
        if: always()
        run: |
          mkdir -p /tmp/lab04
      - run: uv run ruff check .
      - run: uv run ruff format --diff . || true
      - run: uv run ruff format .
      - run: uv run ruff format --check .
      - name: Show formatting patch and lock
        run: |
          git diff
          cat uv.lock
      - run: uv run pyright
      - run: uv run pytest --cov=findex --cov-report=term-missing
      - run: uv build
      - run: uv tool install dist/*.whl
      - run: findex --help
      - uses: actions/upload-artifact@v4
        with:
          name: findex-wheel
          path: dist/*.whl
