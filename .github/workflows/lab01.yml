name: Lab 08 checks
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install uv
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format .
      - run: git diff
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest --cov=findex --cov-report=term-missing
      - run: uv run python scripts/download_python_docs.py
      - run: uv run findex index data/python_docs --out data/index.json --positions
      - run: uv run python scripts/benchmark_lab08.py
      - run: uv run python scripts/benchmark_large.py
      - name: Docker smoke
        run: |
          docker build -t findex .
          docker run -d --name findex-ci -p 8001:8000 findex
          trap 'docker rm -f findex-ci || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8001/health; then
              curl -fsS http://127.0.0.1:8001/openapi.json | python -c 'import json,sys; assert json.load(sys.stdin)["info"]["version"]=="1.0.0"'
              exit 0
            fi
            sleep 1
          done
          docker logs findex-ci
          exit 1
