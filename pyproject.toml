[project]
name = "findex"
version = "1.0.0"
description = "Streaming corpus and ranked search engine"
requires-python = ">=3.12"
dependencies = ["typer>=0.12", "rich>=13", "httpx>=0.28", "fastapi", "uvicorn", "jinja2", "pydantic-settings", "numpy>=2.2"]

[project.scripts]
findex = "findex.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov", "hypothesis", "ruff>=0.9", "pyright", "pytest-benchmark"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyright]
include = ["src/findex"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
markers = ["slow: tests taking more than one second"]
