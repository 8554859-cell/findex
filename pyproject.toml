[project]
name = "findex"
version = "0.4.0"
description = "Streaming corpus and ranked search engine"
requires-python = ">=3.12"
dependencies = ["typer>=0.12", "rich>=13"]

[project.scripts]
findex = "findex.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov", "hypothesis", "ruff>=0.9", "pyright"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyright]
include = ["src/findex"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
markers = ["slow: tests taking more than one second"]
